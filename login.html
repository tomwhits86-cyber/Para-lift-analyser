<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — RefLight</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0a1628;
      --navy-mid: #112040;
      --navy-light: #1a2f55;
      --gold: #c9a84c;
      --gold-light: #e2c06a;
      --gold-dim: rgba(201,168,76,0.15);
      --white: #ffffff;
      --grey: #8a9ab5;
      --error: #e05555;
      --success: #4caf82;
    }

    html, body {
      height: 100%;
      background: var(--navy);
      font-family: 'DM Sans', sans-serif;
      color: var(--white);
    }

    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    /* Background texture */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 50% -10%, rgba(201,168,76,0.08) 0%, transparent 70%),
        radial-gradient(ellipse 40% 40% at 90% 90%, rgba(201,168,76,0.04) 0%, transparent 60%);
      pointer-events: none;
      z-index: 0;
    }

    /* Grid lines */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
    }

    .page-wrap {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Nav */
    nav {
      padding: 20px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 28px;
      letter-spacing: 3px;
      color: var(--white);
      text-decoration: none;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-link {
      font-size: 13px;
      color: var(--grey);
      text-decoration: none;
      transition: color 0.2s;
    }

    .nav-link:hover { color: var(--gold); }

    /* Main card area */
    .main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--navy-mid);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 4px;
      padding: 48px 40px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: cardIn 0.4s ease both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .card-header {
      margin-bottom: 36px;
    }

    .card-eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--gold);
      margin-bottom: 10px;
    }

    .card-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 36px;
      letter-spacing: 2px;
      color: var(--white);
      line-height: 1;
    }

    .card-sub {
      margin-top: 8px;
      font-size: 14px;
      color: var(--grey);
      font-weight: 300;
    }

    /* Form */
    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--grey);
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--navy);
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 3px;
      padding: 13px 16px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--white);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input::placeholder { color: rgba(138,154,181,0.5); }

    input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08);
    }

    .btn {
      width: 100%;
      margin-top: 8px;
      padding: 15px;
      background: var(--gold);
      border: none;
      border-radius: 3px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 18px;
      letter-spacing: 2px;
      color: var(--navy);
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:hover { background: var(--gold-light); }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .message {
      margin-top: 16px;
      padding: 12px 16px;
      border-radius: 3px;
      font-size: 14px;
      display: none;
    }

    .message.error {
      background: rgba(224,85,85,0.1);
      border: 1px solid rgba(224,85,85,0.3);
      color: #f08080;
      display: block;
    }

    .message.success {
      background: rgba(76,175,130,0.1);
      border: 1px solid rgba(76,175,130,0.3);
      color: #6fcfa0;
      display: block;
    }

    .divider {
      margin: 28px 0;
      border: none;
      border-top: 1px solid rgba(201,168,76,0.1);
    }

    .switch-link {
      text-align: center;
      font-size: 14px;
      color: var(--grey);
    }

    .switch-link a {
      color: var(--gold);
      text-decoration: none;
      font-weight: 500;
    }

    .switch-link a:hover { text-decoration: underline; }

    /* Beta badge */
    .beta-badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.3);
      border-radius: 2px;
      padding: 2px 7px;
      vertical-align: middle;
      margin-left: 8px;
      position: relative;
      top: -2px;
    }

    /* Spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(10,22,40,0.3);
      border-top-color: var(--navy);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    footer {
      padding: 20px 32px;
      text-align: center;
      font-size: 12px;
      color: rgba(138,154,181,0.4);
    }

    footer a { color: rgba(201,168,76,0.5); text-decoration: none; }
    footer a:hover { color: var(--gold); }
  </style>
</head>
<body>
<div class="page-wrap">

  <nav>
    <a href="/" class="logo">REF<span>LIGHT</span></a>
    <a href="/" class="nav-link">← Back to site</a>
  </nav>

  <main class="main">
    <div class="card">
      <div class="card-header">
        <div class="card-eyebrow">Athlete &amp; Coach Access</div>
        <div class="card-title">Sign In <span class="beta-badge">Beta</span></div>
        <div class="card-sub">Access your analysis credits and history</div>
      </div>

      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com" autocomplete="email">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      </div>

      <button class="btn" id="loginBtn" onclick="handleLogin()">Sign In</button>

      <div class="message" id="message"></div>

      <hr class="divider">

      <div class="switch-link">
        Don't have an account? <a href="/register.html">Create one</a>
      </div>
    </div>
  </main>

  <footer>
    &copy; 2025 RefLight &nbsp;·&nbsp; <a href="/privacy.html">Privacy</a> &nbsp;·&nbsp; <a href="/terms.html">Terms</a>
  </footer>

</div>

<script>
  const API = 'https://para-lift-analyser-production.up.railway.app';

  // If already logged in, redirect to app
  if (localStorage.getItem('reflight_token')) {
    window.location.href = '/para-lift-analyser-app.html';
  }

  // Allow Enter key to submit
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') handleLogin();
  });

  async function handleLogin() {
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const msg = document.getElementById('message');

    msg.className = 'message';
    msg.textContent = '';

    if (!email || !password) {
      showMessage('Please enter your email and password.', 'error');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Signing in...';

    try {
      const res = await fetch(API + '/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });

      const data = await res.json();

      if (!res.ok) {
        showMessage(data.error || 'Login failed. Please try again.', 'error');
        btn.disabled = false;
        btn.textContent = 'Sign In';
        return;
      }

      // Store token and user info
      localStorage.setItem('reflight_token', data.token);
      localStorage.setItem('reflight_email', data.user.email);
      localStorage.setItem('reflight_credits', data.user.credits);

      showMessage('Signed in. Redirecting...', 'success');

      setTimeout(() => {
        window.location.href = '/para-lift-analyser-app.html';
      }, 800);

    } catch(err) {
      showMessage('Network error. Please check your connection.', 'error');
      btn.disabled = false;
      btn.textContent = 'Sign In';
    }
  }

  function showMessage(text, type) {
    const msg = document.getElementById('message');
    msg.textContent = text;
    msg.className = 'message ' + type;
  }
</script>
</body>
</html>
